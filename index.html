<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <!-- 封鎖雙指縮放（依需求原樣加入） -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1a1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>符文之境</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="data/icon.svg">
  <link rel="apple-touch-icon" href="data/apple-touch-icon.png">

  <!-- 樣式：一個區塊一個檔案 -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/top-bar.css">
  <link rel="stylesheet" href="css/grid.css">
  <link rel="stylesheet" href="css/bottom-bar.css">
  <link rel="stylesheet" href="css/draw-mode.css">
  <link rel="stylesheet" href="css/modal.css">
  <link rel="stylesheet" href="css/toast.css">
  <link rel="stylesheet" href="css/landscape-overlay.css">
  <link rel="stylesheet" href="css/game-over.css">
  <link rel="stylesheet" href="css/tour.css">
</head>
<body>

  <!-- ===== 主畫面：上（標題欄）／中（8 個按鈕）／下（計時欄） ===== -->
  <div id="app">
    <header id="top-bar" class="bar">
      <button id="back-btn" type="button" aria-label="返回上一步">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
      </button>
      <h1 id="title" data-control>符文之境</h1>
      <button id="draw-btn" type="button" aria-label="選起始玩家（長按進入）">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V4s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22v-8"/></svg>
      </button>
    </header>

    <main id="grid-area">
      <div id="grid" role="group" aria-label="八個錄音按鈕">
        <!-- 抽選起始玩家時，顯示在按鈕與左右邊界之間 -->
        <div class="draw-hint draw-hint-left" aria-hidden="true" hidden><span>請玩家依序點擊一個符文，抽中紅色即為起始玩家</span></div>
        <div class="draw-hint draw-hint-right" aria-hidden="true" hidden><span>請玩家依序點擊一個符文，抽中紅色即為起始玩家</span></div>
      </div>
    </main>

    <footer id="bottom-bar" class="bar">
      <button id="timer" type="button" aria-label="計時器">15:00</button>
    </footer>
  </div>

  <!-- ===== 操作說明 Modal（長按標題開啟） ===== -->
  <div id="intro-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="intro-title" hidden>
    <div class="modal-content">
      <button id="intro-close" class="modal-close" type="button" aria-label="關閉">×</button>
      <h2 id="intro-title">操作說明</h2>
      <ul class="help-list">
        <li><b>長按符文</b>：嗶聲後錄音（至多 20 秒）</li>
        <li><b>雙擊符文</b>：播放錄音；點空白處停止</li>
        <li><b>拖曳符文到標題</b>：刪除錄音</li>
        <li><b>返回鍵</b>：單擊回上一步／雙擊重做／長按整個重置</li>
        <li><b>計時器</b>：雙擊開始／暫停；長按調整時間</li>
        <li><b>旗子</b>：長按選起始，每人輪流點一個符文，點到紅色就是起始玩家</li>
        <li><b>標題</b>：長按顯示此說明</li>
      </ul>
      <div class="modal-row">
        <button id="intro-replay" class="modal-btn secondary" type="button">重播介紹</button>
        <a id="intro-rulebook" class="modal-btn secondary" href="data/rulebook.pdf" target="_blank" rel="noopener">遊戲規則書.pdf</a>
      </div>
    </div>
  </div>

  <!-- ===== 計時器設定 Modal ===== -->
  <div id="timer-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="timer-modal-title" hidden>
    <div class="modal-content">
      <h3 id="timer-modal-title">設定時間</h3>
      <div class="modal-choices">
        <button class="modal-btn choice" type="button" data-minutes="10">10 分</button>
        <button class="modal-btn choice" type="button" data-minutes="15">15 分</button>
        <button class="modal-btn choice" type="button" data-minutes="20">20 分</button>
        <button class="modal-btn choice" type="button" data-minutes="30">30 分</button>
      </div>
      <button id="timer-reset" class="modal-btn danger" type="button">重置計時器</button>
    </div>
  </div>

  <!-- ===== 通用確認 Modal（層級最高，可疊在其他 Modal 上） ===== -->
  <div id="confirm-modal" class="modal-overlay confirm" role="alertdialog" aria-modal="true" aria-labelledby="confirm-text" hidden>
    <div class="modal-content">
      <h3 id="confirm-text">確定執行？</h3>
      <button id="confirm-yes" class="modal-btn danger" type="button">確定</button>
      <button id="confirm-no" class="modal-btn secondary" type="button">取消</button>
    </div>
  </div>

  <!-- ===== 遊戲結束遮罩 ===== -->
  <div id="game-over" role="alertdialog" aria-label="遊戲結束" hidden>
    <div class="game-over-title">遊戲結束</div>
    <div class="game-over-hint">點擊畫面重置時間</div>
  </div>

  <!-- ===== 橫放遮罩（CSS Media Query 控制顯示） ===== -->
  <div id="landscape-overlay">請將手機轉回直立方向以繼續遊戲</div>

  <noscript><p style="color:#fff;padding:2rem">請啟用 JavaScript 以使用符文之境。</p></noscript>

  <!-- ES Module：一個功能一個檔案，由 main.js 統一組裝 -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
